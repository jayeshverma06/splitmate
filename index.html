<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SplitMate - Split Bills Easily</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="app">

        <!-- =========================
             HEADER
        ========================== -->
        <header class="header">

            <div class="greeting">

                <p class="greeting-small">
                    Good afternoon!
                    <span class="sparkle">✦</span>
                </p>

                <h1>Ready to split a bill?</h1>

            </div>

            <button class="notification-btn" aria-label="Notifications">

                <span class="notification-icon">♧</span>

                <span class="notification-badge"></span>

            </button>

        </header>


        <!-- =========================
             HERO CARD
        ========================== -->
        <section class="hero-card">

            <!-- Decorative glow -->
            <div class="hero-glow hero-glow-one"></div>
            <div class="hero-glow hero-glow-two"></div>

            <!-- Decorative receipt -->
            <div class="receipt-decoration">
                <div class="receipt-line"></div>
                <div class="receipt-line short"></div>
                <div class="receipt-line"></div>
                <div class="receipt-line tiny"></div>
            </div>


            <div class="hero-content">

                <span class="hero-label">
                    ZERO-STRESS MATH
                </span>

                <h2>
                    Split a new bill
                </h2>

                <p>
                    Add a bill and split it with your friends seamlessly.
                </p>

                <a href="pages/new-bill.html" class="primary-btn">
                    <span>Start Splitting</span>
                    <span class="arrow">→</span>
                </a>

            </div>

        </section>


        <!-- =========================
             QUICK ACTIONS
        ========================== -->
        <section class="section">

            <div class="section-heading">

                <h2>Quick actions</h2>

            </div>


            <div class="quick-actions">

                <!-- Scan Receipt -->
                <button class="action-card">

                    <div class="action-icon scan-icon">
                        <span>⌁</span>
                    </div>

                    <div class="action-text">

                        <h3>Scan Receipt</h3>

                        <p>
                            Auto-detect items
                        </p>

                    </div>

                    <span class="action-arrow">→</span>

                </button>


                <!-- Enter Manually -->
                <a href="pages/new-bill.html" class="action-card">

                    <div class="action-icon manual-icon">
                        <span>＋</span>
                    </div>

                    <div class="action-text">

                        <h3>Enter Manually</h3>

                        <p>
                            Type the amount
                        </p>

                    </div>

                    <span class="action-arrow">→</span>

                </a>

            </div>

        </section>


    </main>


    <!-- JavaScript -->
    <script src="js/app.js"></script>

</body>
</html>
