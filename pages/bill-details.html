<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>History - SplitMate</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>
    <main class="flow-shell history-shell">
        <header class="flow-header">
            <a class="back-link" href="../index.html" aria-label="Back to home">←</a>
            <h1>Bill history</h1>
        </header>

        <section class="history-main" aria-labelledby="history-title">
            <div class="history-heading">
                <div>
                    <p class="dialog-kicker">YOUR ACTIVITY</p>
                    <h2 id="history-title">Past bills</h2>
                    <p>Every bill you have created and confirmed.</p>
                </div>
                <a class="primary-button history-add" href="new-bill.html">＋ New bill</a>
            </div>

            <div class="history-filters" role="group" aria-label="History filters">
                <button class="history-filter active" type="button" data-filter="all">All</button>
                <button class="history-filter" type="button" data-filter="pending">Pending</button>
                <button class="history-filter" type="button" data-filter="settled">Settled</button>
            </div>

            <div id="history-list" class="history-list"></div>

            <div id="history-empty" class="history-empty" hidden>
                <div class="empty-icon">◔</div>
                <h2>No bills yet</h2>
                <p>Once you confirm a split bill, it will appear here.</p>
                <a class="primary-button" href="new-bill.html">Create your first bill</a>
            </div>
        </section>

        <nav data-navbar></nav>
    </main>

    <script type="module" src="../js/navbar.js"></script>
    <script type="module" src="../js/history.js"></script>
</body>

</html>
