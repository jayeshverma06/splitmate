<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Review bill - SplitMate</title>
    <link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/responsive.css">
</head>

<body>
    <main class="flow-shell">
        <header class="flow-header"><a class="back-link" href="people.html">←</a><button class="view-toggle" type="button" data-view-toggle>Phone view</button>
            <h1>Review & share</h1>
        </header>
        <section class="flow-main">
            <div class="stepper"><span class="step">Bill</span><span class="step">People</span><span
                    class="step">Split</span><span class="step active">Done</span></div>
            <div class="review-card"><strong id="review-name"></strong><small id="review-category"
                    style="display:block;color:#777"></small><b id="review-total" style="float:right;color:#3700c9"></b>
            </div>
            <div class="review-receipt">
                <h2>SPLITMATE · RECEIPT</h2>
                <h2 id="receipt-name" style="color:#0b1c30"></h2>
                <p id="receipt-date" style="text-align:center;font-size:10px"></p>
                <div class="receipt-divider"></div>
                <p>Bill total <span id="receipt-subtotal" style="float:right"></span></p>
                <div class="receipt-divider"></div>
                <div class="receipt-total"><span>Total amount</span><span id="receipt-total"></span></div>
                <div class="receipt-divider"></div><small id="breakdown-title"></small>
                <div id="review-participants"></div>
                <div class="tax-total" style="margin-top:18px;display:block;text-align:center;color:#5a27d9">Each person
                    pays on average <strong id="average-share"></strong></div>
            </div>
            <h3 style="font-size:12px;margin:18px 0 4px">Send payment request via:</h3>
            <div class="share-grid"><button class="share-choice" data-share="WhatsApp"><span
                        class="share-option">▤</span><small>WhatsApp</small></button><button class="share-choice"
                    data-share="SMS"><span class="share-option">▰</span><small>SMS</small></button><button
                    class="share-choice" data-share="Copy link"><span class="share-option">↗</span><small>Copy
                        Link</small></button><button class="share-choice" data-share="QR code"><span
                        class="share-option">▦</span><small>QR Code</small></button></div><button
                class="primary-button confirm-button" id="confirm-bill">Confirm & Split Bill →</button><a
                class="outline-button" style="display:flex;align-items:center;justify-content:center;margin-top:8px"
                href="people.html">Edit Split Details</a>
            <p class="flow-subtitle" id="review-status" role="status"></p>
        </section>
    </main>
    <script type="module" src="../js/review.js"></script><script src="../js/view-mode.js"></script>
</body>

</html>
