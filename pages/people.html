<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Add people - SplitMate</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <main class="flow-shell">
        <header class="flow-header"><a class="back-link" href="new-bill.html">←</a>
            <h1>Add people</h1>
        </header>
        <section class="flow-main">
            <div class="stepper"><span class="step">Bill</span><span class="step active">People</span><span
                    class="step">Split</span><span class="step">Done</span></div>
            <p class="flow-subtitle">STEP 2 OF 4 · PEOPLE</p>
            <h2 class="flow-title">Who is splitting this bill?</h2>
            <p class="flow-subtitle" id="people-summary"></p>
            <div class="method-grid" id="method-grid"><button class="method active" data-method="equal">⚖<strong>Equal
                        Split</strong><small>Everyone pays evenly</small></button><button class="method"
                    data-method="percentage">％<strong>Percentage</strong><small>Use percentages</small></button><button
                    class="method" data-method="exact">▣<strong>Exact Amount</strong><small>Set each
                        amount</small></button><button class="method" data-method="shares">☷<strong>Custom
                        Shares</strong><small>Use weighted shares</small></button></div>
            <div class="section-heading people-heading"><strong>Participants <small
                        id="people-count"></small></strong><span class="flow-subtitle">Share preview</span></div>
            <div id="participants"></div><button class="outline-button add-person-button" type="button">＋ Add
                person</button>
            <div class="success-card" id="balance-message"></div>
        </section>
        <footer class="flow-footer"><a class="primary-button" href="review.html" id="continue-review">Continue to Review
                →</a></footer>
    </main>
    <dialog id="person-dialog">
        <form method="dialog" id="person-form"><button class="close-button" type="button" id="close-person">×</button>
            <p class="dialog-kicker">NEW PARTICIPANT</p>
            <h2>Add a person</h2><label>Name<input name="name" required placeholder="e.g. Alex"></label><label>Contact
                (optional)<input name="contact" placeholder="Email or phone"></label><button class="primary-button"
                value="default">Add person</button>
        </form>
    </dialog>
    <script type="module" src="../js/people.js"></script>
</body>

</html>
